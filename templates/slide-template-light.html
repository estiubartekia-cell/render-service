<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>{{title}} — estiubarTEK</title>

  <!-- Tipografías del sistema estiubarTEK -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ─────────────────────────────────────────────────────────
       TOKENS DE DISEÑO  — estiubarTEK Tech/IA Institucional (Light)
    ───────────────────────────────────────────────────────── */
    :root {
      /* Light mode: paleta invertida */
      --deep-space:        #09121B;   /* texto principal */
      --ghost-white:       #F8F9FA;   /* fondo base */

      /* Acentos: se mantienen */
      --cyan:              #00F5FF;
      --violet:            #7B61FF;

      /* Dimensiones de glow más sutiles en light */
      --cyan-dim:          rgba(0, 245, 255, 0.07);
      --cyan-border:       rgba(0, 245, 255, 0.30);
      --violet-dim:        rgba(123, 97, 255, 0.07);
      --violet-border:     rgba(123, 97, 255, 0.30);

      /* Sombras naturales para profundidad en light */
      --shadow-sm:         0 4px 16px rgba(9, 18, 27, 0.06);
      --shadow-md:         0 10px 30px rgba(9, 18, 27, 0.08);
      --shadow-lg:         0 20px 60px rgba(9, 18, 27, 0.10);
    }

    /* ─────────────────────────────────────────────────────────
       RESET & BASE
    ───────────────────────────────────────────────────────── */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* ─────────────────────────────────────────────────────────
       CANVAS DEL SLIDE  (1080 × 1350 — formato Instagram 4:5)
    ───────────────────────────────────────────────────────── */
    body {
      width: 1080px;
      height: 1350px;

      /* Fondo light: gradiente muy sutil para evitar lo plano */
      background:
        radial-gradient(ellipse at 12% 8%, rgba(123, 97, 255, 0.06) 0%, transparent 45%),
        radial-gradient(ellipse at 88% 92%, rgba(0, 245, 255, 0.05) 0%, transparent 45%),
        linear-gradient(160deg, #F8F9FA 0%, #EEF0F4 60%, #F2F4F8 100%);

      font-family: 'Inter', sans-serif;
      color: var(--deep-space);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      position: relative;
    }

    /* ─────────────────────────────────────────────────────────
       1. FONDO — Grid tech tenue (líneas muy suaves en light)
    ───────────────────────────────────────────────────────── */
    .bg-grid {
      position: absolute;
      inset: 0;
      /* Opacidad reducida vs dark mode: 0.035 → 0.018 para luz */
      background-image:
        linear-gradient(rgba(9, 18, 27, 0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(9, 18, 27, 0.018) 1px, transparent 1px);
      background-size: 72px 72px;
      pointer-events: none;
      z-index: 0;
    }

    /* Ambient radial glows — atenuados para light mode */
    .bg-glow-violet {
      position: absolute;
      top: -180px;
      left: -120px;
      width: 700px;
      height: 700px;
      /* Opacidad reducida: 0.13 → 0.07 */
      background: radial-gradient(ellipse, rgba(123, 97, 255, 0.07) 0%, transparent 68%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }
    .bg-glow-cyan {
      position: absolute;
      bottom: -120px;
      right: -80px;
      width: 620px;
      height: 620px;
      /* Opacidad reducida: 0.09 → 0.05 */
      background: radial-gradient(ellipse, rgba(0, 245, 255, 0.05) 0%, transparent 68%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    /* ─────────────────────────────────────────────────────────
       2. REFLEJO DE LOGO — esquina superior izquierda
    ───────────────────────────────────────────────────────── */
    .logo-reflection {
      position: absolute;
      top: 48px;
      left: 56px;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 2;
      opacity: 0.90;
    }

    .logo-reflection img {
      height: 36px;
      width: auto;
      display: block;
      /* En light mode: oscurecer imagen para contraste sobre fondo claro */
      filter: brightness(0) saturate(100%) invert(8%) sepia(14%) saturate(1200%) hue-rotate(185deg) brightness(95%) contrast(100%);
    }

    .logo-reflection-text {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--deep-space);
      letter-spacing: 0.01em;
      line-height: 1;
    }

    /* ─────────────────────────────────────────────────────────
       3. LÍNEA DE ACENTO — borde superior degradado
          (se mantiene igual: violet → cyan)
    ───────────────────────────────────────────────────────── */
    .accent-top-line {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--violet), var(--cyan));
      z-index: 2;
    }

    /* Línea inferior sutil — adaptada a light */
    .accent-bottom-line {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(9, 18, 27, 0.12), transparent);
      z-index: 2;
    }

    /* ─────────────────────────────────────────────────────────
       4. GLASSMORPHISM CARD — adaptada para light mode
          Fondo: rgba(255,255,255,0.6) con blur
    ───────────────────────────────────────────────────────── */
    .glass-card {
      position: absolute;
      /* Posición idéntica al dark template */
      top: 160px;
      left: 56px;
      right: 56px;
      bottom: 120px;

      /* Glass blanco en lugar de glass oscuro */
      background: linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.72) 0%,
        rgba(255, 255, 255, 0.52) 100%
      );
      border: 1px solid rgba(255, 255, 255, 0.90);
      border-radius: 28px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);

      /* Sombras suaves para profundidad (clave en light mode) */
      box-shadow:
        0 0 0 1px rgba(9, 18, 27, 0.04),
        0 10px 30px rgba(9, 18, 27, 0.08),
        0 32px 80px rgba(9, 18, 27, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);

      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 72px 80px;
      z-index: 1;
      overflow: hidden;
    }

    /* Specular highlight del glass — arriba a la izquierda */
    .glass-card::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 0;
      right: 0;
      height: 120px;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.60) 0%,
        transparent 100%
      );
      pointer-events: none;
      border-radius: 28px 28px 0 0;
    }

    /* Decorative glow blob interno (esquina superior derecha) — más sutil */
    .glass-card::after {
      content: '';
      position: absolute;
      top: -60px;
      right: -40px;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(123, 97, 255, 0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ─────────────────────────────────────────────────────────
       5. JERARQUÍA TIPOGRÁFICA
    ───────────────────────────────────────────────────────── */

    /* Eyebrow — etiqueta superior pequeña */
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .eyebrow-line {
      display: block;
      height: 1px;
      width: 36px;
      flex-shrink: 0;
    }
    .eyebrow-line--left {
      background: linear-gradient(90deg, transparent, var(--violet));
    }
    .eyebrow-line--right {
      background: linear-gradient(90deg, var(--cyan), transparent);
    }
    .eyebrow-label {
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      /* Violet en light: opacidad completa, suficiente contraste */
      color: var(--violet);
    }

    /* Heading principal h1 */
    .slide-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 64px;
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.02em;
      margin-bottom: 32px;

      /* Gradient text — deep-space → cyan (adaptado a light) */
      background: linear-gradient(135deg, var(--deep-space) 35%, #0088A8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Subtítulo / párrafo */
    .slide-subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 28px;
      font-weight: 400;
      line-height: 1.5;
      /* Texto más oscuro en light: deep-space al 65% */
      color: rgba(9, 18, 27, 0.62);
      max-width: 820px;
      margin-bottom: 48px;
    }

    /* Accent strong dentro del subtítulo */
    .slide-subtitle strong {
      /* En light mode: cyan puro puede ser poco legible;
         se usa una versión más oscura del teal */
      color: #007B8A;
      font-weight: 600;
    }

    /* ─────────────────────────────────────────────────────────
       6. SLOT DE CONTENIDO ADICIONAL
          (stat chips, bullet tags, badges — opcionales)
    ───────────────────────────────────────────────────────── */
    .content-extras {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 8px;
      position: relative;
      z-index: 1;
    }

    /* Chip / stat badge estilo estiubarTEK — light mode */
    .stat-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      /* Fondo blanco con borde cyan: legible en light */
      background: rgba(255, 255, 255, 0.80);
      border: 1px solid rgba(0, 200, 210, 0.35);
      border-radius: 100px;
      padding: 10px 20px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      /* Texto: versión oscura del cyan para contraste */
      color: #007B8A;
      letter-spacing: 0.02em;
      box-shadow: var(--shadow-sm);
    }
    .stat-chip--violet {
      background: rgba(255, 255, 255, 0.80);
      border-color: rgba(123, 97, 255, 0.30);
      color: var(--violet);
    }

    /* Dot pulsante — se mantiene */
    .pulse-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 4px rgba(0, 245, 255, 0.50);
      animation: dot-pulse 2.4s ease-in-out infinite;
      flex-shrink: 0;
    }
    .stat-chip--violet .pulse-dot {
      background: var(--violet);
      box-shadow: 0 0 4px rgba(123, 97, 255, 0.50);
      animation-delay: 0.8s;
    }

    @keyframes dot-pulse {
      0%, 100% { opacity: 1;   transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }

    /* ─────────────────────────────────────────────────────────
       7. FOOTER DEL SLIDE
    ───────────────────────────────────────────────────────── */
    .slide-footer {
      position: absolute;
      bottom: 36px;
      left: 56px;
      right: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 2;
    }

    .footer-domain {
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      font-weight: 500;
      /* deep-space al 30% — sutil, no molesta */
      color: rgba(9, 18, 27, 0.30);
      letter-spacing: 0.04em;
    }

    /* Número de slide */
    .slide-number {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      color: rgba(9, 18, 27, 0.18);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

  </style>
</head>

<body>

  <!-- ── Fondo: grid tech tenue + ambient glows atenuados ── -->
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow-violet" aria-hidden="true"></div>
  <div class="bg-glow-cyan" aria-hidden="true"></div>

  <!-- ── Línea de acento superior (degradado violet → cyan) ── -->
  <div class="accent-top-line" aria-hidden="true"></div>
  <div class="accent-bottom-line" aria-hidden="true"></div>

  <!-- ── Reflejo de marca — esquina superior izquierda ── -->
  <!-- Logo filtrado a dark para contraste sobre fondo claro -->
  <div class="logo-reflection">
    <img
      src="../../assets/img/logo_estiubarTEK_t.png"
      alt="estiubarTEK"
    >
    <span class="logo-reflection-text">estiubarTEK</span>
  </div>

  <!-- ── Glassmorphism card — zona de contenido ── -->
  <div class="glass-card">

    <!-- Eyebrow / etiqueta de categoría -->
    <div class="eyebrow" aria-hidden="true">
      <span class="eyebrow-line eyebrow-line--left"></span>
      <span class="eyebrow-label">{{eyebrow}}</span>
      <span class="eyebrow-line eyebrow-line--right"></span>
    </div>

    <!-- Título principal — gradient text (deep-space → teal oscuro) -->
    <h1 class="slide-title">{{title}}</h1>

    <!-- Subtítulo / mensaje clave -->
    <p class="slide-subtitle">{{subtitle}}</p>

    <!-- Chips / stat badges opcionales — eliminar si no se usan -->
    <div class="content-extras">
      <span class="stat-chip">
        <span class="pulse-dot" aria-hidden="true"></span>
        {{stat_1}}
      </span>
      <span class="stat-chip stat-chip--violet">
        <span class="pulse-dot" aria-hidden="true"></span>
        {{stat_2}}
      </span>
    </div>

  </div><!-- /.glass-card -->

  <!-- ── Footer de slide ── -->
  <footer class="slide-footer" role="contentinfo">
    <span class="footer-domain">estiubartek.com</span>
    <span class="slide-number">{{slide_number}}</span>
  </footer>

</body>
</html>
