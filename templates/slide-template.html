<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>{{title}} — estiubarTEK</title>

  <!-- Tipografías del sistema estiubarTEK -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ─────────────────────────────────────────────────────────
       TOKENS DE DISEÑO  — estiubarTEK Tech/IA Institucional
    ───────────────────────────────────────────────────────── */
    :root {
      --deep-space:   #09121B;
      --cyan:         #00F5FF;
      --violet:       #7B61FF;
      --ghost-white:  #F8F9FA;
      --cyan-dim:     rgba(0, 245, 255, 0.08);
      --cyan-border:  rgba(0, 245, 255, 0.25);
      --violet-dim:   rgba(123, 97, 255, 0.08);
      --violet-border:rgba(123, 97, 255, 0.25);
    }

    /* ─────────────────────────────────────────────────────────
       RESET & BASE
    ───────────────────────────────────────────────────────── */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* ─────────────────────────────────────────────────────────
       CANVAS DEL SLIDE  (1080 × 1350 — formato Instagram 4:5)
    ───────────────────────────────────────────────────────── */
    body {
      width: 1080px;
      height: 1350px;
      background: var(--deep-space);
      font-family: 'Inter', sans-serif;
      color: var(--ghost-white);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      position: relative;
    }

    /* ─────────────────────────────────────────────────────────
       1. FONDO — Grid tech + ambient glow blobs
    ───────────────────────────────────────────────────────── */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 245, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 245, 255, 0.035) 1px, transparent 1px);
      background-size: 72px 72px;
      pointer-events: none;
      z-index: 0;
    }

    /* Ambient radial glows — espejo del index.html */
    .bg-glow-violet {
      position: absolute;
      top: -180px;
      left: -120px;
      width: 700px;
      height: 700px;
      background: radial-gradient(ellipse, rgba(123, 97, 255, 0.13) 0%, transparent 68%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }
    .bg-glow-cyan {
      position: absolute;
      bottom: -120px;
      right: -80px;
      width: 620px;
      height: 620px;
      background: radial-gradient(ellipse, rgba(0, 245, 255, 0.09) 0%, transparent 68%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    /* ─────────────────────────────────────────────────────────
       2. REFLEJO DE LOGO — esquina superior izquierda
          Espejo exacto del logo-wrap de index.html
    ───────────────────────────────────────────────────────── */
    .logo-reflection {
      position: absolute;
      top: 48px;
      left: 56px;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 2;
      opacity: 0.88;
    }

    .logo-reflection img {
      height: 36px;
      width: auto;
      display: block;
      /* Filtro para lograr el contraste correcto sobre el fondo oscuro */
      filter: brightness(1) contrast(1);
    }

    .logo-reflection-text {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--ghost-white);
      letter-spacing: 0.01em;
      line-height: 1;
    }

    /* ─────────────────────────────────────────────────────────
       3. LÍNEA DE ACENTO — borde superior degradado
    ───────────────────────────────────────────────────────── */
    .accent-top-line {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--violet), var(--cyan));
      z-index: 2;
    }

    /* Línea de acento inferior sutil */
    .accent-bottom-line {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0, 245, 255, 0.3), transparent);
      z-index: 2;
    }

    /* ─────────────────────────────────────────────────────────
       4. GLASSMORPHISM CARD — contenedor principal de contenido
    ───────────────────────────────────────────────────────── */
    .glass-card {
      position: absolute;
      /* centrado vertical con margen para logo y footer */
      top: 160px;
      left: 56px;
      right: 56px;
      bottom: 120px;

      background: linear-gradient(
        145deg,
        rgba(0, 245, 255, 0.04) 0%,
        rgba(123, 97, 255, 0.07) 100%
      );
      border: 1px solid rgba(0, 245, 255, 0.14);
      border-radius: 28px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow:
        0 0 0 1px rgba(0, 245, 255, 0.06),
        0 24px 80px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);

      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 72px 80px;
      z-index: 1;

      /* Subtle inner top-left glow (specular highlight) */
      overflow: hidden;
    }

    /* Specular highlight del glass — arriba a la izquierda */
    .glass-card::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 0;
      right: 0;
      height: 120px;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.04) 0%,
        transparent 100%
      );
      pointer-events: none;
      border-radius: 28px 28px 0 0;
    }

    /* Decorative glow blob interno (esquina superior derecha) */
    .glass-card::after {
      content: '';
      position: absolute;
      top: -60px;
      right: -40px;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(123, 97, 255, 0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ─────────────────────────────────────────────────────────
       5. JERARQUÍA TIPOGRÁFICA
    ───────────────────────────────────────────────────────── */

    /* Eyebrow — etiqueta superior pequeña */
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .eyebrow-line {
      display: block;
      height: 1px;
      width: 36px;
      flex-shrink: 0;
    }
    .eyebrow-line--left {
      background: linear-gradient(90deg, transparent, var(--violet));
    }
    .eyebrow-line--right {
      background: linear-gradient(90deg, var(--cyan), transparent);
    }
    .eyebrow-label {
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--violet);
    }

    /* Heading principal h1 */
    .slide-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 64px;
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.02em;
      margin-bottom: 32px;
      color: var(--ghost-white);

      /* Gradient text — espejo del hero-heading de index.html */
      background: linear-gradient(135deg, var(--ghost-white) 35%, var(--cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Subtítulo / párrafo */
    .slide-subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 28px;
      font-weight: 400;
      line-height: 1.5;
      color: rgba(248, 249, 250, 0.65);
      max-width: 820px;
      margin-bottom: 48px;
    }

    /* Accent strong dentro del subtítulo */
    .slide-subtitle strong {
      color: var(--cyan);
      font-weight: 600;
    }

    /* ─────────────────────────────────────────────────────────
       6. SLOT DE CONTENIDO ADICIONAL
          (stat chips, bullet tags, badges — opcionales)
    ───────────────────────────────────────────────────────── */
    .content-extras {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 8px;
      position: relative;
      z-index: 1;
    }

    /* Chip / stat badge estilo estiubarTEK */
    .stat-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--cyan-dim);
      border: 1px solid var(--cyan-border);
      border-radius: 100px;
      padding: 10px 20px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--cyan);
      letter-spacing: 0.02em;
    }
    .stat-chip--violet {
      background: var(--violet-dim);
      border-color: var(--violet-border);
      color: var(--violet);
    }

    /* Dot pulsante (reutiliza el patron del status-badge de index) */
    .pulse-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 6px var(--cyan);
      animation: dot-pulse 2.4s ease-in-out infinite;
      flex-shrink: 0;
    }
    .stat-chip--violet .pulse-dot {
      background: var(--violet);
      box-shadow: 0 0 6px var(--violet);
      animation-delay: 0.8s;
    }

    @keyframes dot-pulse {
      0%, 100% { opacity: 1;   transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }

    /* ─────────────────────────────────────────────────────────
       7. FOOTER DEL SLIDE
    ───────────────────────────────────────────────────────── */
    .slide-footer {
      position: absolute;
      bottom: 36px;
      left: 56px;
      right: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 2;
    }

    .footer-domain {
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      font-weight: 500;
      color: rgba(248, 249, 250, 0.35);
      letter-spacing: 0.04em;
    }

    /* Número de slide */
    .slide-number {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      color: rgba(248, 249, 250, 0.2);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

  </style>
</head>

<body>

  <!-- ── Fondo: grid tech + ambient glows ── -->
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow-violet" aria-hidden="true"></div>
  <div class="bg-glow-cyan" aria-hidden="true"></div>

  <!-- ── Línea de acento superior (degradado violet → cyan) ── -->
  <div class="accent-top-line" aria-hidden="true"></div>
  <div class="accent-bottom-line" aria-hidden="true"></div>

  <!-- ── Reflejo de marca — esquina superior izquierda ── -->
  <!-- Espejo del logo-wrap en index.html (logo_estiubarTEK_cb.png + texto) -->
  <div class="logo-reflection">
    <img
      src="../../assets/img/logo_estiubarTEK_t.png"
      alt="estiubarTEK"
    >
    <span class="logo-reflection-text">estiubarTEK</span>
  </div>

  <!-- ── Glassmorphism card — zona de contenido ── -->
  <div class="glass-card">

    <!-- Eyebrow / etiqueta de categoría -->
    <div class="eyebrow" aria-hidden="true">
      <span class="eyebrow-line eyebrow-line--left"></span>
      <span class="eyebrow-label">{{eyebrow}}</span>
      <span class="eyebrow-line eyebrow-line--right"></span>
    </div>

    <!-- Título principal — gradient text (ghost-white → cyan) -->
    <h1 class="slide-title">{{title}}</h1>

    <!-- Subtítulo / mensaje clave -->
    <p class="slide-subtitle">{{subtitle}}</p>

    <!-- Chips / stat badges opcionales — eliminar si no se usan -->
    <div class="content-extras">
      <span class="stat-chip">
        <span class="pulse-dot" aria-hidden="true"></span>
        {{stat_1}}
      </span>
      <span class="stat-chip stat-chip--violet">
        <span class="pulse-dot" aria-hidden="true"></span>
        {{stat_2}}
      </span>
    </div>

  </div><!-- /.glass-card -->

  <!-- ── Footer de slide ── -->
  <footer class="slide-footer" role="contentinfo">
    <span class="footer-domain">estiubartek.com</span>
    <span class="slide-number">{{slide_number}}</span>
  </footer>

</body>
</html>
